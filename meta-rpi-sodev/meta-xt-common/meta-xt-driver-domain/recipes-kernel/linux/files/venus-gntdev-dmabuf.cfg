# [Venus] gntdev's dma-buf extension, which 0014 extends with an ioctl that hands a
# dma-buf's frame numbers to the device model. Without it the device model cannot
# share a virtio-gpu host-visible blob whose backing is a dma-buf into the guest's
# physmap: qemu's 0116 then withdraws that window rather than leaving it emulated
# (arm64 SIMD stores to emulated MMIO are undecodable by Xen), and the guest's
# vkMapMemory on it fails with VK_ERROR_MEMORY_MAP_FAILED.
#
# XEN_GNTDEV_DMABUF depends on XEN_GRANT_DMA_ALLOC, which is unset in both the
# bcm2711 (RPi4) and bcm2712 (RPi5) defconfigs, so both are needed.
# CONFIG_UDMABUF, which qemu 0121 needs, is already =y in both -- checked in the
# generated .config of each board's DomD kernel -- so it is not repeated here.
# XEN_GNTDEV is already on, and DMA_SHARED_BUFFER is selected by
# XEN_GNTDEV_DMABUF itself.
CONFIG_XEN_GRANT_DMA_ALLOC=y
CONFIG_XEN_GNTDEV_DMABUF=y
