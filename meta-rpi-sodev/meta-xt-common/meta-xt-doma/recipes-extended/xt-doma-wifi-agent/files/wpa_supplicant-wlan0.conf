# DomD's real radio, driven entirely over the control socket by
# /usr/bin/domd_wifi_agent.py. See xt-doma-wifi-agent.bb.
#
# WHY A SEPARATE FILE INSTEAD OF /etc/wpa_supplicant.conf.
# poky's wpa-supplicant_2.11.bb installs wpa_supplicant.conf-sane as
# /etc/wpa_supplicant.conf, and that file ends with
#     network={
#             key_mgmt=NONE
#     }
# which is a WILDCARD match: no ssid field, so wpa_supplicant will associate
# with ANY open access point in range, unprompted, before the agent has said
# anything. On a lab bench that is an unpredictable default route appearing
# under the NAT this design installs. This file has no network block at all --
# every network comes from the agent's ADD_NETWORK/SET_NETWORK/SELECT_NETWORK
# sequence (domd_wifi_agent.py connect_real_ap()).
#
# ctrl_interface is the DIRECTORY; wpa_supplicant names the socket after the
# interface, so this yields /run/wpa_supplicant/wlan0 -- exactly the path
# domd-wifi-agent.service waits for and the agent's default --ctrl.
# /var/run is a symlink to /run on this image, so either spelling works;
# /run is written here to match the agent.
ctrl_interface=/run/wpa_supplicant
ctrl_interface_group=0

# The agent adds networks at runtime. Without update_config=1 wpa_supplicant
# refuses SAVE_CONFIG, and while the agent never calls it today, leaving it on
# keeps a hand-driven wpa_cli session usable for triage.
update_config=1
