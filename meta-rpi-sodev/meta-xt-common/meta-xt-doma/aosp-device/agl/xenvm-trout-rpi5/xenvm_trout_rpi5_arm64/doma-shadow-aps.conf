#
# Seed for /data/vendor/wifi/shadow/aps.conf.
#
# /vendor/bin/doma-shadow-ap MERGES this file into aps.conf on every boot,
# adding only the SSIDs aps.conf does not have yet, so a PSK the user typed on
# screen is never overwritten.
#
# FORMAT: one AP per line, <SSID>TAB<PSK>. An empty PSK makes the shadow AP
# open. The first row of aps.conf becomes the primary BSS.
#
# THE ROW BELOW IS A PLACEHOLDER, NOT A WORKING AP.
# doma-shadow-ap exits with "$APS is empty" when this file has no data row, so
# one row has to exist for a freshly flashed card to reach a usable Wi-Fi screen
# at all. It is deliberately not a real network: this file lives in a source
# tree, and a real row here is a passphrase published inside a vendor image.
#
# To join a real AP, type its passphrase on the DomA Wi-Fi settings screen. The
# shadow AP validates that handshake locally and cannot learn a PSK from it --
# only a MIC crosses the air -- and one failed handshake disables the network
# permanently (config_wifiDisableReasonByWrongPasswordThreshold is 1 and
# ...DurationMs is -1 in ServiceWifiResources/res/values/config.xml).
# DomaWifiRelay then reads the typed passphrase, hands it to the shadow AP and
# to DomD, and calls WifiManager.connect(), which clears the disable. Editing
# the copy on the device -- /data/vendor/wifi/shadow/aps.conf, one
# "SSID<TAB>PSK" per line -- works as well.
#
# Never commit a real SSID or passphrase back into this file, as a row or in a
# comment.
EXAMPLE-SSID	change-me-00000000
