# Run the AGL instrument cluster on Vulkan (Venus) instead of OpenGL.
#
# ivi-homescreen picks its render backend at COMPILE time (shell/view/flutter_view.cc
# is an #if/#elif chain and cmake/options.cmake offers BUILD_BACKEND_WAYLAND_VULKAN
# only when BUILD_BACKEND_WAYLAND_EGL is OFF), so the Vulkan lane is a SECOND binary,
# /usr/bin/flutter-auto-vulkan, built by meta-agl-venus beside the shipped
# /usr/bin/flutter-auto. This drop-in is what actually puts it in front of the panel.
#
# --enable-impeller is required, not a preference: the engine's Skia Vulkan backend
# fails here -- every command buffer begin/end returns VK_ERROR_OUT_OF_HOST_MEMORY and
# nothing is drawn -- while Impeller, Flutter's own Vulkan path, renders correctly
# (screenshot-verified). Unmatched arguments reach the engine through
# config.view.vm_args, so appending the switch is all that is needed.
#
# The empty ExecStart= is systemd's way of clearing the unit's list before setting a
# new one; without it this would be a second ExecStart and systemd would refuse the
# unit (Type=simple takes exactly one).
#
# Measured on the RPi5 DomU at 1080x1920 (docs/VULKAN-VENUS.md sections 7b-7d):
# 54.0 fps once the host could import the guest's dma-bufs (qemu 0117) and 60.0 fps
# with explicit format modifiers (this layer's mesa 0003), against 60.0 for the shipped
# Skia/OpenGL lane. Before those two, this lane needed MESA_VK_WSI_DEBUG=sw -- a CPU
# copy per frame -- and ran at 24.0 fps; if a board ever needs that workaround again it
# belongs in /etc/default/flutter-cluster-dashboard, which the unit already reads.
[Service]
ExecStart=
ExecStart=/usr/bin/flutter-auto-vulkan -b /usr/share/flutter/flutter_cluster_dashboard/${FLUTTER_VERSION}/${FLUTTER_RUNTIME} --enable-impeller
