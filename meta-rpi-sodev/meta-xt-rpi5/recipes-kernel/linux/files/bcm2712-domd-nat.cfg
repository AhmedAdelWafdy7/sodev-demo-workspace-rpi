# DomA/DomU -> internet NAT for the RPi5 DomD kernel.
#
# The same netfilter set as the Pi 4's, in bcm2711-domd-hw.cfg. The userspace
# half of the NAT path -- /etc/modules-load.d/domd-nat.conf and
# /usr/bin/domd-flatbridge-up -- ships from meta-xt-common for both boards, so
# without this file every userspace piece is present and correct and there is
# nothing to load.
#
# MEASURED ON THIS BOARD (DomD, 6.18.33-v8-16k) without this file:
#     # iptables -t nat -S
#     modprobe: FATAL: Module ip_tables not found in directory /lib/modules/6.18.33-v8-16k
#     iptables v1.8.13 (legacy): can't initialize iptables table `nat': Table does not exist
# and /lib/modules/.../kernel/net held only 13 modules: x_tables, nf_nat,
# nf_conntrack, nf_defrag_ipv[46], bridge, stp, llc, ipv6, bluetooth, cfg80211,
# rfkill, sch_fq_codel. DomA then showed "connected, no internet"
# (NetworkAgentInfo for wlan0 lacking the VALIDATED capability).
#
# Since 6.18 the legacy tables are separate modules and form a chain:
#   IP_NF_NAT / IP_NF_FILTER -> IP_NF_IPTABLES_LEGACY -> NETFILTER_XTABLES_LEGACY
# Without NETFILTER_XTABLES_LEGACY ip_tables.ko / iptable_nat.ko / iptable_filter.ko
# are never built, and IP_NF_NAT is not on by default, so those two are named. The
# userspace on this board is xtables-legacy-multi (iptables v1.8.13 (legacy)), so the
# legacy tables are the ones it needs; there is no nft binary and no nf_tables module here.
CONFIG_NETFILTER_XTABLES_LEGACY=y
CONFIG_IP_NF_NAT=m
